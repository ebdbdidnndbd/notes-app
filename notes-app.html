<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفكرة دراسية - السادس العلمي</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0b1120;
            --surface: #1e293b;
            --surface-light: #334155;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* شاشة الدخول */
        .card {
            width: 92%; max-width: 400px; background: var(--surface); padding: 28px 22px;
            border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card h2 { font-size: 20px; color: var(--primary); margin-bottom: 6px; }
        .card p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
        .pin-input {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--surface-light);
            background: var(--bg); color: #fff; font-size: 18px; text-align: center; letter-spacing: 3px;
            outline: none; margin-bottom: 12px;
        }
        .pin-input:focus { border-color: var(--primary); }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 12px; font-size: 15px;
            font-weight: bold; cursor: pointer; transition: 0.2s; color: #fff; background: var(--primary-dark);
        }
        .btn:active { transform: scale(0.98); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        #errMsg { color: #f87171; font-size: 13px; margin-top: 12px; min-height: 20px; }

        /* شاشة المحادثة */
        #chatApp { display: none; width: 100%; max-width: 550px; height: 100dvh; flex-direction: column; background: var(--bg); }
        .header {
            background: var(--surface); padding: 12px 15px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .header-info h3 { font-size: 15px; color: #fff; }
        .header-info span { font-size: 11px; color: var(--success); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--surface-light); border: none; color: #fff; width: 36px; height: 36px;
            border-radius: 10px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn.red { background: rgba(239,68,68,0.2); color: #f87171; }

        /* منطقة الرسائل */
        .messages {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .msg {
            max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px;
            line-height: 1.5; position: relative; word-wrap: break-word; animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg.me { background: var(--primary-dark); align-self: flex-start; border-bottom-right-radius: 4px; }
        .msg.other { background: var(--surface); align-self: flex-end; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 4px; display: block; }
        .msg audio { width: 210px; height: 36px; margin-top: 4px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.65); display: block; text-align: left; margin-top: 4px; }

        /* شريط الإرسال */
        .input-bar {
            background: var(--surface); padding: 10px; display: flex; align-items: center; gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .input-bar input[type="text"] {
            flex: 1; background: var(--bg); border: 1px solid var(--surface-light); color: #fff;
            padding: 11px 14px; border-radius: 20px; font-size: 14px; outline: none;
        }
        .send-btn {
            background: var(--primary); color: #fff; border: none; width: 42px; height: 42px;
            border-radius: 50%; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .recording { background: var(--danger) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* شاشة المكالمات */
        #callOverlay {
            display: none; position: fixed; inset: 0; background: rgba(11,17,32,0.96); z-index: 999;
            flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 20px;
        }
        .video-grid { width: 100%; max-width: 450px; flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; background: #1e293b; }
        #localVideo { width: 110px; height: 150px; object-fit: cover; border-radius: 12px; position: absolute; bottom: 15px; right: 15px; border: 2px solid var(--primary); }
        .call-controls { display: flex; gap: 20px; margin-top: 20px; }
        .call-btn { width: 58px; height: 58px; border-radius: 50%; border: none; font-size: 22px; color: #fff; cursor: pointer; }

        /* لوحة التحكم */
        #adminPanel { display: none; width: 94%; max-width: 460px; max-height: 92dvh; overflow-y: auto; text-align: right; }
        .stat-box { background: var(--bg); padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--surface-light); }
        .stat-box label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; }
        .log-list { max-height: 130px; overflow-y: auto; font-size: 12px; color: #cbd5e1; background: var(--bg); padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 1. شاشة القفل المموهة -->
    <div class="card" id="loginScreen">
        <h2>📚 مفكرة السادس العلمي</h2>
        <p>أدخل رمز الجلسة الدراسية للمتابعة</p>
        <input type="password" id="pinField" class="pin-input" placeholder="•••••" onkeypress="if(event.key==='Enter') verifyAccess()">
        <button class="btn" onclick="verifyAccess()">فتح المفكرة</button>
        <div id="errMsg"></div>
    </div>

    <!-- 2. شاشة المحادثة المتكاملة -->
    <div id="chatApp">
        <div class="header">
            <div class="header-info">
                <h3>مساحة المراجعة الخاصة</h3>
                <span id="connStatus">● متصل ومشفر</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="مكالمة صوتية" onclick="startCall(false)">📞</button>
                <button class="icon-btn" title="مكالمة فيديو" onclick="startCall(true)">📹</button>
                <button class="icon-btn red" title="مسح المحادثة" onclick="wipeChat(true)">🗑️</button>
                <button class="icon-btn" title="قفل سريع" onclick="quickLock()">🔒</button>
            </div>
        </div>

        <div class="messages" id="msgContainer"></div>

        <div class="input-bar">
            <input type="file" id="imgPicker" accept="image/*" style="display:none" onchange="handleImage(event)">
            <button class="icon-btn" onclick="document.getElementById('imgPicker').click()">📷</button>
            <button class="icon-btn" id="micBtn" onclick="toggleRecord()">🎤</button>
            <input type="text" id="textInput" placeholder="اكتب ملاحظة..." onkeypress="if(event.key==='Enter') sendText()">
            <button class="send-btn" onclick="sendText()">➤</button>
        </div>
    </div>

    <!-- 3. شاشة الاتصال المباشر -->
    <div id="callOverlay">
        <h3 id="callStatusText" style="color:#38bdf8;">جاري الاتصال...</h3>
        <div class="video-grid">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="call-btn btn-success" id="acceptCallBtn" style="display:none;" onclick="answerIncomingCall()">📞</button>
            <button class="call-btn btn-danger" onclick="endCall()">📵</button>
        </div>
    </div>

    <!-- 4. لوحة التحكم الخاصة (Admin Dashboard) -->
    <div class="card" id="adminPanel">
        <h2 style="text-align:center;">🛡️ لوحة التحكم والإدارة</h2>
        <p style="text-align:center;">تحكم كامل عن بُعد بالمنصة والبيانات</p>

        <div class="stat-box">
            <label>حالة المنصة (Kill Switch):</label>
            <button class="btn" id="toggleLockBtn" onclick="toggleSystemLock()">جاري التحميل...</button>
        </div>

        <div class="stat-box">
            <label>تغيير رمز الدخول السري عن بُعد:</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="newPinInput" class="pin-input" style="margin:0; font-size:15px; padding:10px;" placeholder="الرمز الجديد">
                <button class="btn" style="width:110px;" onclick="updateRemotePin()">حفظ</button>
            </div>
        </div>

        <div class="stat-box">
            <label>سجل النشاط ومحاولات الدخول:</label>
            <div class="log-list" id="adminLogs">لا توجد سجلات بعد...</div>
        </div>

        <div style="display:flex; gap:8px; margin-top:15px;">
            <button class="btn btn-danger" onclick="nukeDatabase()">تدمير شامل للبيانات ☢️</button>
            <button class="btn" style="background:#475569;" onclick="quickLock()">خروج</button>
        </div>
    </div>

    <script>
        // ================= الإعدادات الأساسية =================
        const DB_URL = "https://notes-app-c738e-default-rtdb.firebaseio.com";
        const DEFAULT_USER_PIN = "2007H";
        const ADMIN_PIN = "9988";
        // ======================================================

        let failedCount = parseInt(localStorage.getItem("sec_fails") || "0");
        let myId = localStorage.getItem("device_uid");
        if (!myId) {
            myId = "dev_" + Math.random().toString(36).substring(2, 8);
            localStorage.setItem("device_uid", myId);
        }

        let currentConfig = { pin: DEFAULT_USER_PIN, locked: false };
        let lastMsgCount = 0;
        let pollTimer = null;

        // جلب إعدادات النظام من السحابة
        async function syncConfig() {
            try {
                const res = await fetch(`${DB_URL}/sys_config.json`);
                const data = await res.json();
                if (data) {
                    if (data.pin) currentConfig.pin = data.pin;
                    currentConfig.locked = !!data.locked;
                } else {
                    await fetch(`${DB_URL}/sys_config.json`, {
                        method: "PUT",
                        body: JSON.stringify(currentConfig)
                    });
                }
            } catch (e) {}
        }
        syncConfig();

        // تسجيل الأحداث للوحة التحكم
        async function logEvent(text) {
            const time = new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
            await fetch(`${DB_URL}/sys_logs.json`, {
                method: "POST",
                body: JSON.stringify({ msg: `[${time}] ${text}`, ts: Date.now() })
            });
        }

        // التحقق من الرمز عند الدخول
        async function verifyAccess() {
            const val = document.getElementById("pinField").value.trim();
            const err = document.getElementById("errMsg");
            await syncConfig();

            if (failedCount >= 3) {
                triggerSelfDestruct();
                return;
            }

            // دخول لوحة التحكم
            if (val === ADMIN_PIN) {
                failedCount = 0;
                localStorage.setItem("sec_fails", "0");
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                loadAdminData();
                return;
            }

            // فحص الإيقاف عن بعد
            if (currentConfig.locked) {
                err.innerText = "النظام متوقف حالياً للصيانة من قبل المسؤول.";
                return;
            }

            // دخول المحادثة
            if (val === currentConfig.pin) {
                failedCount = 0;
                localStorage.setItem("sec_fails", "0");
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("chatApp").style.display = "flex";
                logEvent(`دخول ناجح من الجهاز (${myId})`);
                initChat();
            } else {
                failedCount++;
                localStorage.setItem("sec_fails", failedCount.toString());
                document.getElementById("pinField").value = "";
                logEvent(`محاولة دخول فاشلة (${failedCount}/3) بالرمز: ${val}`);

                if (failedCount >= 3) {
                    await wipeChat(false);
                    triggerSelfDestruct();
                } else {
                    err.innerText = `رمز غير صحيح! المتبقي ${3 - failedCount} محاولات قبل مسح البيانات.`;
                }
            }
        }

        function triggerSelfDestruct() {
            document.body.innerHTML = `
                <div style="text-align:center; padding:30px; color:#94a3b8;">
                    <h1 style="color:#ef4444; font-size:42px;">503</h1>
                    <h3>Service Temporarily Unavailable</h3>
                    <p style="margin-top:10px; font-size:13px;">تم مسح البيانات وحظر الجلسة لأسباب أمنية.</p>
                </div>`;
        }

        function quickLock() {
            location.reload();
        }

        // ================= نظام المحادثة =================
        function initChat() {
            fetchMessages();
            pollTimer = setInterval(fetchMessages, 2500);
            initPeerCalls();
        }

        async function fetchMessages() {
            try {
                // فحص إذا تم إغلاق النظام عن بعد أثناء الجلسة
                const cfgRes = await fetch(`${DB_URL}/sys_config/locked.json`);
                const isLocked = await cfgRes.json();
                if (isLocked === true) { quickLock(); return; }

                const res = await fetch(`${DB_URL}/messages.json`);
                const data = await res.json();
                const container = document.getElementById("msgContainer");

                if (!data) {
                    container.innerHTML = "";
                    lastMsgCount = 0;
                    return;
                }

                const items = Object.values(data);
                if (items.length === lastMsgCount) return;
                lastMsgCount = items.length;

                container.innerHTML = "";
                items.forEach(m => {
                    const div = document.createElement("div");
                    div.className = "msg " + (m.sender === myId ? "me" : "other");

                    if (m.type === "text") {
                        div.innerText = m.content;
                    } else if (m.type === "image") {
                        const img = document.createElement("img");
                        img.src = m.content;
                        div.appendChild(img);
                    } else if (m.type === "audio") {
                        const aud = document.createElement("audio");
                        aud.controls = true;
                        aud.src = m.content;
                        div.appendChild(aud);
                    }

                    const timeSpan = document.createElement("span");
                    timeSpan.className = "msg-time";
                    timeSpan.innerText = m.time || "";
                    div.appendChild(timeSpan);
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (e) {}
        }

        function getNowTime() {
            return new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
        }

        async function pushMessage(type, content) {
            await fetch(`${DB_URL}/messages.json`, {
                method: "POST",
                body: JSON.stringify({
                    sender: myId,
                    type: type,
                    content: content,
                    time: getNowTime()
                })
            });
            fetchMessages();
        }

        function sendText() {
            const inp = document.getElementById("textInput");
            const txt = inp.value.trim();
            if (!txt) return;
            inp.value = "";
            pushMessage("text", txt);
        }

        // ضغط وإرسال الصور مباشرة بدون سيرفر خارجي
        function handleImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const maxW = 720;
                    const scale = maxW / img.width;
                    canvas.width = img.width > maxW ? maxW : img.width;
                    canvas.height = img.width > maxW ? img.height * scale : img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressed = canvas.toDataURL("image/jpeg", 0.65);
                    pushMessage("image", compressed);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // تسجيل وإرسال بصمة صوتية
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecord() {
            const btn = document.getElementById("micBtn");
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: "audio/webm" });
                        const reader = new FileReader();
                        reader.onloadend = () => pushMessage("audio", reader.result);
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add("recording");
                } catch (e) {
                    alert("يرجى السماح بالوصول إلى المايكروفون.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove("recording");
            }
        }

        async function wipeChat(confirmAsk) {
            if (confirmAsk && !confirm("هل أنت متأكد من مسح المحادثة بالكامل عند الطرفين؟")) return;
            await fetch(`${DB_URL}/messages.json`, { method: "DELETE" });
            lastMsgCount = 0;
            document.getElementById("msgContainer").innerHTML = "";
        }

        // ================= المكالمات المباشرة (P2P WebRTC) =================
        let peer = null;
        let activeCall = null;
        let incomingCallObj = null;
        let localStream = null;

        function initPeerCalls() {
            peer = new Peer("study_room_" + myId);
            peer.on("open", async (peerId) => {
                await fetch(`${DB_URL}/active_peers/${myId}.json`, {
                    method: "PUT",
                    body: JSON.stringify({ peerId: peerId, ts: Date.now() })
                });
            });

            peer.on("call", (call) => {
                incomingCallObj = call;
                document.getElementById("callOverlay").style.display = "flex";
                document.getElementById("callStatusText").innerText = "مكالمة واردة...";
                document.getElementById("acceptCallBtn").style.display = "inline-block";
            });
        }

        async function startCall(withVideo) {
            const res = await fetch(`${DB_URL}/active_peers.json`);
            const peers = await res.json();
            if (!peers) { alert("الطرف الآخر غير متصل حالياً."); return; }

            const targetEntry = Object.entries(peers).find(([k, v]) => k !== myId);
            if (!targetEntry) { alert("الطرف الآخر غير موجود في الجلسة حالياً."); return; }

            const targetPeerId = targetEntry[1].peerId;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });
                document.getElementById("localVideo").srcObject = localStream;
                document.getElementById("callOverlay").style.display = "flex";
                document.getElementById("callStatusText").innerText = "جاري الاتصال...";
                document.getElementById("acceptCallBtn").style.display = "none";

                activeCall = peer.call(targetPeerId, localStream);
                activeCall.on("stream", (remoteStream) => {
                    document.getElementById("callStatusText").innerText = "متصل الآن";
                    document.getElementById("remoteVideo").srcObject = remoteStream;
                });
                activeCall.on("close", endCall);
            } catch (e) {
                alert("تعذر الوصول للكاميرا أو المايكروفون.");
            }
        }

        async function answerIncomingCall() {
            if (!incomingCallObj) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById("localVideo").srcObject = localStream;
                document.getElementById("acceptCallBtn").style.display = "none";
                document.getElementById("callStatusText").innerText = "متصل الآن";

                incomingCallObj.answer(localStream);
                activeCall = incomingCallObj;
                activeCall.on("stream", (remoteStream) => {
                    document.getElementById("remoteVideo").srcObject = remoteStream;
                });
                activeCall.on("close", endCall);
            } catch (e) {
                alert("تعذر فتح المايكروفون/الكاميرا للرد.");
            }
        }

        function endCall() {
            if (activeCall) activeCall.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById("callOverlay").style.display = "none";
        }

        // ================= لوحة التحكم (Admin Functions) =================
        async function loadAdminData() {
            await syncConfig();
            const btn = document.getElementById("toggleLockBtn");
            if (currentConfig.locked) {
                btn.innerText = "المنصة متوقفة حالياً (اضغط للتشغيل) 🟢";
                btn.className = "btn btn-success";
            } else {
                btn.innerText = "المنصة تعمل حالياً (اضغط للإيقاف الفوري) 🔴";
                btn.className = "btn btn-danger";
            }

            const logRes = await fetch(`${DB_URL}/sys_logs.json`);
            const logs = await logRes.json();
            const logBox = document.getElementById("adminLogs");
            if (logs) {
                logBox.innerHTML = Object.values(logs).reverse().map(l => `<div>• ${l.msg}</div>`).join("");
            }
        }

        async function toggleSystemLock() {
            currentConfig.locked = !currentConfig.locked;
            await fetch(`${DB_URL}/sys_config/locked.json`, {
                method: "PUT",
                body: JSON.stringify(currentConfig.locked)
            });
            logEvent(currentConfig.locked ? "تم إيقاف المنصة من لوحة التحكم" : "تم تشغيل المنصة من لوحة التحكم");
            loadAdminData();
        }

        async function updateRemotePin() {
            const newPin = document.getElementById("newPinInput").value.trim();
            if (!newPin) return;
            await fetch(`${DB_URL}/sys_config/pin.json`, {
                method: "PUT",
                body: JSON.stringify(newPin)
            });
            document.getElementById("newPinInput").value = "";
            logEvent("تم تغيير رمز الدخول السري من لوحة التحكم");
            alert("تم تحديث رمز الدخول بنجاح!");
        }

        async function nukeDatabase() {
            if (!confirm("تحذير نهائي: سيتم حذف جميع الرسائل والسجلات نهائياً! هل أنت متأكد؟")) return;
            await fetch(`${DB_URL}/messages.json`, { method: "DELETE" });
            await fetch(`${DB_URL}/sys_logs.json`, { method: "DELETE" });
            alert("تم تنظيف السيرفر بالكامل.");
